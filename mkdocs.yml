site_name: Polyblocks
site_description: Solvers for global monotonic optimisation problems
repo_url: https://github.com/RashwanA/polyblocks
docs_dir: docs

theme:
  name: material
  palette:
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Home: index.md
  - API Reference: reference.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_root_heading: true
            show_source: true
            merge_init_into_class: true
            members_order: source

markdown_extensions:
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path: [.]
      check_paths: true

extra_javascript:
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
